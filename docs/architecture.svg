<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Arduino FSM to ROS2 bridge architecture diagram</title>
  <desc>Three-stage pipeline: Arduino Uno sends serial data to fsm_talker on a laptop, which publishes over CycloneDDS to fsm_listener on a Raspberry Pi 4.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .leader { stroke: #888; stroke-width: 0.5; stroke-dasharray: 3 3; }

    /* Light mode defaults */
    .teal-box { fill: #E1F5EE; stroke: #0F6E56; }
    .teal-box .th { fill: #085041; }
    .teal-box .ts { fill: #0F6E56; }

    .purple-box { fill: #EEEDFE; stroke: #534AB7; }
    .purple-box .th { fill: #3C3489; }
    .purple-box .ts { fill: #534AB7; }

    .coral-box { fill: #FAECE7; stroke: #993C1D; }
    .coral-box .th { fill: #712B13; }
    .coral-box .ts { fill: #993C1D; }

    .gray-box { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray-box .ts { fill: #5F5E5A; }

    .arr { stroke: #888; stroke-width: 1.5; }
    .label { fill: #5F5E5A; font-size: 12px; }

    @media (prefers-color-scheme: dark) {
      .teal-box { fill: #085041; stroke: #5DCAA5; }
      .teal-box .th { fill: #9FE1CB; }
      .teal-box .ts { fill: #5DCAA5; }

      .purple-box { fill: #3C3489; stroke: #AFA9EC; }
      .purple-box .th { fill: #CECBF6; }
      .purple-box .ts { fill: #AFA9EC; }

      .coral-box { fill: #712B13; stroke: #F0997B; }
      .coral-box .th { fill: #F5C4B3; }
      .coral-box .ts { fill: #F0997B; }

      .gray-box { fill: #444441; stroke: #B4B2A9; }
      .gray-box .ts { fill: #B4B2A9; }

      .arr { stroke: #9c9a92; }
      .label { fill: #B4B2A9; }
      .leader { stroke: #9c9a92; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Arduino Uno box -->
  <g class="teal-box">
    <rect x="40" y="50" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="115" y="70" text-anchor="middle" dominant-baseline="central">Arduino Uno</text>
    <text class="ts" x="115" y="88" text-anchor="middle" dominant-baseline="central">3-state FSM</text>
  </g>

  <!-- Arrow: Arduino → Talker -->
  <line x1="190" y1="78" x2="248" y2="78" class="arr" marker-end="url(#arrow)"/>
  <text class="label" x="219" y="68" text-anchor="middle">USB serial</text>
  <text class="label" x="219" y="110" text-anchor="middle">9600 baud</text>

  <!-- fsm_talker box -->
  <g class="purple-box">
    <rect x="250" y="50" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="325" y="70" text-anchor="middle" dominant-baseline="central">fsm_talker</text>
    <text class="ts" x="325" y="88" text-anchor="middle" dominant-baseline="central">Laptop / WSL2</text>
  </g>

  <!-- Arrow: Talker → Listener -->
  <line x1="400" y1="78" x2="458" y2="78" class="arr" marker-end="url(#arrow)"/>
  <text class="label" x="429" y="68" text-anchor="middle">/led_state</text>
  <text class="label" x="429" y="110" text-anchor="middle">Int32</text>

  <!-- fsm_listener box -->
  <g class="coral-box">
    <rect x="460" y="50" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="70" text-anchor="middle" dominant-baseline="central">fsm_listener</text>
    <text class="ts" x="545" y="88" text-anchor="middle" dominant-baseline="central">Raspberry Pi 4</text>
  </g>

  <!-- Protocol labels below -->
  <g class="gray-box">
    <rect x="107" y="148" width="110" height="36" rx="6" stroke-width="0.5"/>
    <text class="ts" x="162" y="170" text-anchor="middle" dominant-baseline="central">pyserial</text>
  </g>
  <g class="gray-box">
    <rect x="323" y="148" width="110" height="36" rx="6" stroke-width="0.5"/>
    <text class="ts" x="378" y="170" text-anchor="middle" dominant-baseline="central">CycloneDDS</text>
  </g>

  <!-- Leader lines from arrows to protocol boxes -->
  <line class="leader" x1="219" y1="110" x2="162" y2="148"/>
  <line class="leader" x1="429" y1="110" x2="378" y2="148"/>
</svg>
